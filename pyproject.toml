[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "the-board"
version = "0.2.0"
description = "Local-first strategic planning with FastAPI, SQLite, and optional Ollama analysis."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.111,<1.0",
  "pydantic>=2.7,<3.0",
  "requests>=2.31,<3.0",
  "streamlit>=1.32,<2.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1.0", "pytest>=8.2,<9.0"]

[project.scripts]
dev = "scripts.dev:main"
start = "scripts.start:main"
ui = "scripts.ui:main"

[tool.poetry]
packages = [{ include = "src", from = "." }]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
